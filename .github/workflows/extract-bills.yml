name: Extract tax bills

# Crawls the city billing portals a few hours at a time into the hosted database (Supabase).
# Each run continues where the previous one stopped; once everything is fetched, runs finish in
# a minute or two until accounts are older than REFRESH_DAYS (new quarterly bills).
#
# Nothing the crawl collects is written to GitHub: no Actions cache, no release, no artifact.
# Owner names, mailing addresses and raw portal responses go only to the database and its
# private storage bucket. Run logs and the run summary show counts and parcel ids (public
# tax-roll data), never owner data; keep it that way, since the logs of a public repo are public.
#
# Secrets (Settings -> Secrets and variables -> Actions), see docs/hosting.md:
#   DATABASE_URL         Neon direct connection string (no -pooler; see docs/neon.md), or Supabase Session pooler (port 5432)
#   SUPABASE_URL         https://<project>.supabase.co          (for raw responses)
#   SUPABASE_SECRET_KEY  a secret API key (sb_secret_...)      (for raw responses)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Minutes of crawling per job before stopping"
        default: "320"
      include_owners:
        description: "Store owner names, mailing addresses and raw responses (database only)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  REFRESH_DAYS: "80"
  RECHECK_DELINQUENT_DAYS: "7"   # delinquent accounts are re-fetched weekly
  MIN_YEAR: "2019"

jobs:
  extract:
    # forks have no secrets and must not crawl
    if: github.repository_owner == 'ousepachn'
    strategy:
      fail-fast: false
      matrix:
        include:
          - portal: hls          # apps.hlssystems.com
            towns: jersey-city
          - portal: wipp         # wipp.edmundsassoc.com
            towns: union-city hoboken
    concurrency:
      group: extract-${{ matrix.portal }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MAX_MINUTES: ${{ inputs.max_minutes || '320' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check configuration
        env:
          WANT_OWNERS: ${{ github.event_name == 'schedule' || inputs.include_owners }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL secret is not set. See docs/hosting.md."
            exit 1
          fi
          if [ "$WANT_OWNERS" != "true" ]; then
            echo "OWNER_FLAGS=" >> "$GITHUB_ENV"; echo "RAW_FLAGS=" >> "$GITHUB_ENV"
            echo "> Owner fields not collected (turned off for this run)." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ]; then
            echo "OWNER_FLAGS=--include-owners" >> "$GITHUB_ENV"; echo "RAW_FLAGS=--keep-raw" >> "$GITHUB_ENV"
          else
            echo "OWNER_FLAGS=--include-owners" >> "$GITHUB_ENV"; echo "RAW_FLAGS=" >> "$GITHUB_ENV"
            echo "::warning::SUPABASE_URL / SUPABASE_SECRET_KEY not set: raw portal responses are not kept."
          fi

      - name: Crawl
        run: |
          start=$(date +%s)
          left() { echo $(( MAX_MINUTES - ($(date +%s) - start) / 60 )); }
          for town in ${{ matrix.towns }}; do
            [ "$(left)" -le 5 ] && break
            # re-parse stored responses when the parsers changed (no portal requests; only outdated rows)
            python pipeline/extract_bills.py rederive --town "$town" --min-year "$MIN_YEAR" --max-minutes "$(left)"
            [ "$(left)" -le 5 ] && break
            python pipeline/extract_bills.py index --town "$town" --max-minutes "$(left)" $OWNER_FLAGS
            [ "$(left)" -le 5 ] && break
            python pipeline/extract_bills.py fetch --town "$town" --retry-errors \
              --refresh-days "$REFRESH_DAYS" --recheck-delinquent-days "$RECHECK_DELINQUENT_DAYS" \
              --min-year "$MIN_YEAR" --max-minutes "$(left)" $OWNER_FLAGS $RAW_FLAGS
          done

      - name: Summary
        if: always()
        run: |
          { echo "### ${{ matrix.portal }}"; echo '```'; python pipeline/extract_bills.py status; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
